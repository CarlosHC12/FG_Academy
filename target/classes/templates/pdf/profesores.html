<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${titulo}">Listado de Profesores</title>
    <style>
        body {
            font-family: 'Helvetica', Arial, sans-serif;
            margin: 40px;
            color: #333;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            border-bottom: 2px solid #8b5cf6;
            padding-bottom: 20px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo {
            height: 60px;
            width: auto;
        }
        .logo-text {
            font-size: 24px;
            font-weight: bold;
            color: #8b5cf6;
        }
        h1 {
            color: #8b5cf6;
            text-align: center;
            margin: 0;
            font-size: 28px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border: 1px solid #ddd;
        }
        th {
            background-color: #8b5cf6;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #f0f0f0;
        }
        td:last-child {
            border-right: none;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .total {
            margin-top: 20px;
            font-weight: bold;
            text-align: right;
            color: #8b5cf6;
            font-size: 16px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        .footer {
            margin-top: 50px;
            text-align: center;
            color: #999;
            font-size: 11px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .badge {
            background-color: #e0e0e0;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            color: #555;
        }
        .mensaje-vacio {
            text-align: center;
            padding: 40px;
            color: #999;
            font-style: italic;
            border: 1px dashed #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <!-- Sin logo, solo texto -->
    <div class="logo-container">
        <span class="./imagenes/ChatGPT Image 9 feb 2026, 12_10_01.png">FG Academy</span>
    </div>
    <div class="header">
        <div class="logo-container">
            <!-- Aquí va tu logo en base64 -->
            <img src="data:image/png;base64,TU_LOGO_AQUI" alt="FG Academy" class="logo"/>
            <span class="logo-text">FG Academy</span>
        </div>
        <h1 th:text="${titulo}">Listado de Profesores</h1>
    </div>

    <div th:if="${not #lists.isEmpty(profesores)}">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Juego</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="profesor : ${profesores}">
                    <td><span class="badge" th:text="${profesor.id.value}">1</span></td>
                    <td th:text="${profesor.nombre}">Carlos Rodríguez</td>
                    <td th:text="${profesor.juego}">Street Fighter 6</td>
                </tr>
            </tbody>
        </table>

        <div class="total">
            Total de profesores: <span th:text="${profesores.size()}">0</span>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(profesores)}" class="mensaje-vacio">
        <p>No hay profesores registrados en el sistema</p>
    </div>

    <div class="footer">
        <p>FG Academy - Sistema de Gestión Académica</p>
    </div>
</body>
</html>
