<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FG Academy - Crear Profesor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/crear.css}" rel="stylesheet">
    
</head>
<body>
    <div class="animated-bg" id="animated-bg"></div>
    
    <nav>
        <div class="logo-container">
            <div class="logo">🎮</div>
            <div class="logo-text">FG Academy</div>
        </div>
        <div class="nav-links">
            <a href="/">Inicio</a>
            <a href="/gestion">Gestión</a>
            <a href="/crear/alumno">Crear Alumno</a>
            <a href="/crear/profesor" class="active">Crear Profesor</a>
        </div>
        <div class="language-selector" th:with="lang=${#locale.language}">
   
</div>

    </nav>
    <div>
         <a href="?lang=es" class="lang-flag" 
       th:classappend="${lang == 'es' ? 'active' : ''}"
       title="Español">🇪🇸</a>
    <a href="?lang=en" class="lang-flag"
       th:classappend="${lang == 'en' ? 'active' : ''}"
       title="English">🇬🇧</a>
    <a href="?lang=ja" class="lang-flag"
       th:classappend="${lang == 'ja' ? 'active' : ''}"
       title="日本語">🇯🇵</a>
    <a href="?lang=ko" class="lang-flag"
       th:classappend="${lang == 'ko' ? 'active' : ''}"
       title="한국어">🇰🇷</a>
    </div>
    
    <section class="header">
        <h1>Crear Nuevo Profesor</h1>
        <p>Completa el formulario para registrar un nuevo profesor</p>
    </section>
    
    <div class="main-container">
        <div class="form-panel">
            <form action="/crear/profesor" method="post" class="crear-form">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Carlos Rodríguez" required>
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="juego">Juego especialidad</label>
                        <select id="juego" name="juego" required>
                            <option value="">Selecciona un juego</option>
                            <option value="Guilty Gear -Strive-">Guilty Gear -Strive-</option>
                            <option value="Granblue Fantasy Versus Rising">Granblue Fantasy Versus Rising</option>
                            <option value="Blazblue Centralfiction">Blazblue Centralfiction</option>
                            <option value="Tekken 8">Tekken 8</option>
                            <option value="Street Fighter 6">Street Fighter 6</option>
                            <option value="Mortal Kombat 1">Mortal Kombat 1</option>
                            <option value="2XKO">2XKO</option>
                            <option value="Marvel Tokon Fighting souls">Marvel Tokon Fighting souls</option>
                            <option value="Blazblue Cross tag battle">Blazblue Cross tag battle</option>
                            <option value="Virtua Fighter 5 Revo">Virtua Fighter 5 Revo</option>
                            <option value="Fatal Fury: City of the Wolves">Fatal Fury: City of the Wolves</option>
                            <option value="King of Fighters XVI">King of Fighters XVI</option>
                            <option value="Chaos Code New Sign of Catastrophe">Chaos Code New Sign of Catastrophe</option>
                            <option value="Chaos Code Nemesis Experiment">Chaos Code Nemesis Experiment</option>
                            <option value="Guilty Gear Xrd REV2">Guilty Gear Xrd REV2</option>
                            <option value="DNF Duel">DNF Duel</option>
                            <option value="Ultimate Marvel vs Capcom 3">Ultimate Marvel vs Capcom 3</option>
                            <option value="Invincible vs">Invincible vs</option>
                            <option value="Vampire Savior">Vampire Savior</option>
                            <option value="Under Night In-Birth 2 Sys:Celes">Under Night In-Birth 2 Sys:Celes</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-buttons">
                    <button type="submit" class="btn btn-confirm">
                        <i class="fas fa-save"></i> Crear Profesor
                    </button>
                    <a href="/gestion" class="btn btn-cancel">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DE CONFIRMACIÓN -->
    <div id="modal-confirmacion" class="modal" th:classappend="${creado == 'true' ? 'active' : ''}">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2>¡Profesor Creado!</h2>
            <p th:text="'Profesor: ' + ${nombreCreado} + ' creado correctamente'">Profesor creado correctamente</p>
            <div class="modal-buttons">
                <a href="/crear/profesor" class="btn-modal btn-primary">
                    <i class="fas fa-plus"></i> Crear otro
                </a>
                <a href="/gestion" class="btn-modal btn-secondary">
                    <i class="fas fa-list"></i> Ver listados
                </a>
                <a href="/" class="btn-modal btn-cancel">
                    <i class="fas fa-home"></i> Inicio
                </a>
            </div>
        </div>
    </div>

    <footer>
        <p>FG Academy - Sistema de Gestión &copy; 2024</p>
    </footer>

    <script th:src="@{/js/crear.js}"></script>
</body>
<style>
    :root {
    --primary-dark: #0a1a0a;        /* Verde oscuro profundo */
    --secondary-dark: #1a2a1a;       /* Verde medio oscuro */
    --accent-green: #4CAF50;          /* Verde principal */
    --accent-light: #a5d6a7;          /* Verde claro */
    --accent-glow: rgba(76, 175, 80, 0.4);  /* Brillo verde */
    --accent-lime: #cddc39;            /* Verde lima para contrastes */
    --text-light: #f1f8e9;            /* Texto claro con tono verdoso */
    --border-color: #2e5e2e;           /* Borde verde oscuro */
    --panel-bg: rgba(26, 42, 26, 0.95); /* Fondo panel verde oscuro */
    --gradient-bg: linear-gradient(135deg, #0a1a0a 0%, #1a3a1a 50%, #0a1a0a 100%);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background-color: var(--primary-dark);
    color: var(--text-light);
    min-height: 100vh;
    background-image: var(--gradient-bg);
}

/* Fondo animado */
.animated-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
}

.bg-particle {
    position: absolute;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    border-radius: 50%;
    animation: float 20s infinite linear;
}

@keyframes float {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.3; }
    25% { transform: translateY(-100px) translateX(100px) rotate(90deg); opacity: 0.5; }
    50% { transform: translateY(-50px) translateX(-100px) rotate(180deg); opacity: 0.7; }
    75% { transform: translateY(100px) translateX(50px) rotate(270deg); opacity: 0.5; }
    100% { transform: translateY(0) translateX(0) rotate(360deg); opacity: 0.3; }
}

/* Navbar */
nav {
    background-color: rgba(10, 26, 10, 0.95);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo-container {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo {
    font-size: 2rem;
}

.logo-text {
    font-size: 1.8rem;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent-light), var(--accent-green));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.nav-links {
    display: flex;
    gap: 25px;
}

.nav-links a {
    color: var(--text-light);
    text-decoration: none;
    padding: 8px 15px;
    transition: all 0.3s;
    position: relative;
}

.nav-links a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 0;
    height: 2px;
    background: var(--accent-green);
    transition: all 0.3s ease;
    transform: translateX(-50%);
}

.nav-links a:hover::after,
.nav-links a.active::after {
    width: 80%;
}

.nav-links a:hover,
.nav-links a.active {
    color: var(--accent-green);
}

/* Header */
.header {
    padding: 40px 30px 30px;
    text-align: center;
}

.header h1 {
    font-size: 2.8rem;
    margin-bottom: 10px;
    background: linear-gradient(90deg, var(--text-light), var(--accent-green));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.header p {
    color: #c8e6c9;
    max-width: 800px;
    margin: 0 auto;
}

/* Contenedor principal */
.main-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 30px 60px;
}

/* Formulario */
.form-panel {
    background-color: var(--panel-bg);
    border-radius: 20px;
    padding: 40px;
    border: 1px solid var(--border-color);
    box-shadow: 0 0 30px var(--accent-glow);
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 30px;
}

.full-width {
    grid-column: span 2;
}

.form-group label {
    display: block;
    color: var(--accent-green);
    margin-bottom: 8px;
    font-weight: 600;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px 15px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid var(--border-color);
    border-radius: 10px;
    color: var(--text-light);
    font-size: 1rem;
    transition: all 0.3s;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: var(--accent-green);
    box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
}

.form-group select option {
    background-color: var(--secondary-dark);
}

.form-buttons {
    display: flex;
    gap: 15px;
    margin-top: 20px;
}

.btn {
    flex: 1;
    padding: 14px 20px;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 1rem;
    text-decoration: none;
}

.btn-confirm {
    background: linear-gradient(135deg, var(--accent-green), #2e7d32);
    color: white;
    box-shadow: 0 3px 10px rgba(76, 175, 80, 0.3);
}

.btn-cancel {
    background: transparent;
    color: var(--accent-green);
    border: 2px solid var(--accent-green);
}

.btn-confirm:hover,
.btn-cancel:hover {
    transform: translateY(-3px);
}

.btn-confirm:hover {
    box-shadow: 0 5px 20px rgba(76, 175, 80, 0.5);
}

.btn-cancel:hover {
    background: rgba(76, 175, 80, 0.1);
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(5px);
    z-index: 2000;
    align-items: center;
    justify-content: center;
}

.modal.active {
    display: flex;
}

.modal-content {
    background: var(--panel-bg);
    border: 3px solid var(--accent-green);
    border-radius: 30px;
    padding: 50px;
    max-width: 500px;
    width: 90%;
    text-align: center;
    box-shadow: 0 0 50px rgba(76, 175, 80, 0.3);
}

.modal-icon {
    font-size: 5rem;
    color: var(--accent-green);
    margin-bottom: 20px;
}

.modal-content h2 {
    color: var(--accent-green);
    font-size: 2.2rem;
    margin-bottom: 15px;
}

.modal-content p {
    color: var(--text-light);
    font-size: 1.2rem;
    margin-bottom: 30px;
}

.modal-buttons {
    display: grid;
    gap: 15px;
}

.btn-modal {
    padding: 15px 20px;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.btn-modal.btn-primary {
    background: linear-gradient(135deg, var(--accent-green), #2e7d32);
    color: white;
}

.btn-modal.btn-secondary {
    background: transparent;
    color: var(--accent-green);
    border: 2px solid var(--accent-green);
}

.btn-modal.btn-cancel {
    background: transparent;
    color: #a5d6a7;
    border: 1px solid #a5d6a7;
}

.btn-modal:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 20px rgba(76, 175, 80, 0.3);
}

/* Footer */
footer {
    background-color: rgba(10, 26, 10, 0.95);
    padding: 30px;
    border-top: 1px solid var(--border-color);
    text-align: center;
    color: #a5d6a7;
}

/* Responsive */
@media (max-width: 768px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
    
    .full-width {
        grid-column: span 1;
    }
    
    .form-buttons {
        flex-direction: column;
    }
    
    .header h1 {
        font-size: 2rem;
    }
}
</style>
</html>
